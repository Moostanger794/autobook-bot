name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: autobook_ci
          POSTGRES_USER: autobook
          POSTGRES_PASSWORD: ci-${{ github.run_id }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U autobook -d autobook_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+asyncpg://autobook:ci-${{ github.run_id }}@localhost:5432/autobook_ci
      TEST_DATABASE_URL: postgresql+asyncpg://autobook:ci-${{ github.run_id }}@localhost:5432/autobook_ci
      API_KEY: ci-${{ github.run_id }}
      ADMIN_IDS: "123"
      TIMEZONE: Europe/Moscow
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Apply migrations to clean database
        run: alembic upgrade head
      - name: Run tests
        run: pytest -q
      - name: Lint
        run: ruff check app tests alembic
      - name: Check formatting
        run: ruff format --check app tests alembic
